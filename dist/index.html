<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#16181d" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>webNBT · NBT editor</title>

  <link rel="stylesheet" href="style/app.css" />

  <!-- Wasm NBT codec (self-contained, embedded wasm) -->
  <script src="NBT.js"></script>

  <!-- Core logic (order matters: model → codec → format → region → mcdata) -->
  <script src="src/i18n.js"></script>
  <script src="src/icons.js"></script>
  <script src="src/model.js"></script>
  <script src="src/codec.js"></script>
  <script src="src/format.js"></script>
  <script src="src/region.js"></script>
  <script src="src/mcdata.js"></script>
  <script src="src/treeview.js"></script>
  <script src="src/inspector.js"></script>
  <script src="src/app.js"></script>
</head>
<body>
  <div id="drop-zone">
    <div class="dz-box">
      <div class="dz-title" data-i18n="drop.title">Drop a file here</div>
      <div class="dz-sub" data-i18n="drop.sub">.dat &middot; .schematic &middot; .mcmeta &middot; .mca / .mcr (region) &middot; any NBT
        (gzip, zlib, raw deflate or uncompressed)</div>
    </div>
  </div>

  <div id="loading-shade">
    <div class="load-box">
      <div class="spinner"></div>
      <div id="loading-text" data-i18n="loading.booting">Booting NBT codec…</div>
    </div>
  </div>

  <header id="topbar">
    <div id="brand" title="webNBT — NBT editor">▣ webNBT</div>
    <div id="toolbar">
      <button id="btn-open" data-icon="folder-open" title="Open file (Ctrl+O)" data-i18n-title="btn.open.title"><span data-i18n="btn.open">Open</span></button>
      <button id="btn-save" data-icon="save" title="Save file (Ctrl+S)" data-i18n-title="btn.save.title"><span data-i18n="btn.save">Save</span></button>
      <button id="btn-export" data-icon="arrow-down-up" title="Import / export as SNBT or JSON" data-i18n-title="btn.formats.title"><span data-i18n="btn.formats">⇅ Formats</span></button>

      <span class="tb-sep"></span>

      <button id="btn-undo" data-icon="undo-2" title="Undo (Ctrl+Z)" disabled data-i18n-title="btn.undo.title"></button>
      <button id="btn-redo" data-icon="redo-2" title="Redo (Ctrl+Y)" disabled data-i18n-title="btn.redo.title"></button>
      <button id="btn-history" data-icon="history" title="Undo history" data-i18n-title="btn.history.title"></button>

      <span class="tb-sep"></span>

      <button id="btn-add" data-icon="plus" title="Add tag" data-i18n-title="btn.add.title"></button>
      <button id="btn-duplicate" data-icon="copy" title="Duplicate" disabled data-i18n-title="btn.duplicate.title"></button>
      <button id="btn-delete" data-icon="trash-2" title="Delete tag (Del)" disabled data-i18n-title="btn.delete.title"></button>

      <span class="tb-sep"></span>

      <button id="btn-hex" data-icon="binary" title="Toggle hex view" class="active" data-i18n-title="btn.hex.title"><span data-i18n="btn.hex"># Hex</span></button>
      <button id="btn-smart" data-icon="sparkles" title="Smart views for structures/inventories" class="active" data-i18n-title="btn.smart.title"><span data-i18n="btn.smart">✲ Smart</span></button>
      <button id="btn-theme" data-icon="moon" title="Toggle theme" data-i18n-title="btn.theme.title"></button>
      <button id="btn-types" data-icon="languages" title="Toggle localized type names" data-i18n-title="btn.types.title"></button>
      <button id="btn-bookmarks" data-icon="bookmark" title="Bookmarks" data-i18n-title="btn.bookmarks.title"></button>
      <button id="btn-goto" data-icon="search" title="Go to path (Ctrl+P)" data-i18n-title="btn.goto.title">⌕</button>

      <span class="tb-sep"></span>

      <button id="btn-collapse" data-icon="chevrons-down-up" title="Collapse all (Ctrl+[)" data-i18n-title="btn.collapse.title"></button>
      <button id="btn-expand" data-icon="chevrons-up-down" title="Expand all (Ctrl+])" data-i18n-title="btn.expand.title"></button>
    </div>
    <div id="search-wrap">
      <select id="lang-select" aria-label="Language"></select>
      <input id="search-field" type="search" placeholder="Search tags… (Enter next)" autocomplete="off" data-i18n-placeholder="search.placeholder" />
    </div>
  </header>

  <main id="layout">
    <section id="tree-pane">
      <div id="chunk-tabs" class="hidden"></div>
      <div id="tree" tabindex="0"></div>
      <div id="empty-state">
        <div class="es-big" data-i18n="empty.big">No file loaded</div>
        <div class="es-sub" data-i18n-html="empty.sub">Click <b>Open</b>, drop a file anywhere, or <button id="empty-open">browse…</button></div>
      </div>
    </section>

    <section id="right-pane">
      <div id="inspector">
        <div class="panel-empty" data-i18n="panel.empty">Select a tag to inspect &amp; edit it.</div>
      </div>
      <div id="hexview" class="hidden"></div>
    </section>
  </main>

  <footer id="statusbar">
    <span id="st-file">—</span>
    <span id="st-mode"></span>
    <span id="st-count"></span>
    <span id="st-errors"></span>
    <span id="st-history"></span>
  </footer>

  <input type="file" id="file-input" multiple hidden />
  <input type="file" id="file-compare" hidden />
</body>
</html>
