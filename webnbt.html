<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>webNBT · NBT editor</title>

  <style>
/* ─────────────────────────────── webNBT next ─────────────────────────────── */

:root {
  --radius: 8px;
  --gap: 10px;
  --header-h: 44px;
  --status-h: 24px;

  --bg: #16181d;
  --bg-panel: #1d2027;
  --bg-raised: #262a33;
  --bg-hover: #2d313c;
  --bg-active: #343948;
  --bg-input: #101216;
  --border: #333947;
  --text: #d9dee6;
  --text-dim: #8b93a3;
  --text-faint: #5b6372;
  --accent: #4da3ff;
  --accent-dim: #2c5f87;
  --accent-contrast: #0d1b2b;
  --ok: #3fb950;
  --warn: #d29922;
  --err: #f85149;
  --sel: rgba(77, 163, 255, .18);
  --font: 12px/1.5 ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: 12px/1.5 ui-monospace, "SF Mono", "JetBrains Mono", Consolas, Menlo, monospace;
}
[data-theme="light"] {
  --bg: #f2f3f5;
  --bg-panel: #ffffff;
  --bg-raised: #e9ecf1;
  --bg-hover: #dfe4eb;
  --bg-active: #d3d9e3;
  --bg-input: #ffffff;
  --border: #d3d8e0;
  --text: #20242c;
  --text-dim: #5a6270;
  --text-faint: #9aa2b0;
  --accent: #1f6feb;
  --accent-contrast: #fff;
  --sel: rgba(31, 111, 235, .14);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font: var(--font);
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}
button { font: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
::-webkit-scrollbar-track { background: transparent; }

/* ── topbar ── */
#topbar {
  display: flex;
  align-items: center;
  gap: var(--gap);
  height: var(--header-h);
  padding: 0 12px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
}
#brand { font-weight: 700; letter-spacing: .5px; color: var(--accent); white-space: nowrap; }
#toolbar { display: flex; align-items: center; gap: 4px; flex: 0 1 auto; overflow-x: auto; }
.tb-sep { width: 1px; height: 18px; background: var(--border); margin: 0 6px; }

button {
  background: var(--bg-raised);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 10px;
  cursor: pointer;
  white-space: nowrap;
}
button:hover:not(:disabled) { background: var(--bg-hover); }
button:active:not(:disabled) { background: var(--bg-active); }
button:disabled { opacity: .4; cursor: default; }
button.active { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
button.active:hover { filter: brightness(1.08); }

#search-wrap { margin-left: auto; flex: 0 1 320px; }
#search-field {
  width: 100%;
  background: var(--bg-input);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 10px;
  outline: none;
}
#search-field:focus { border-color: var(--accent); }

/* ── layout ── */
#layout {
  position: absolute;
  inset: var(--header-h) 0 var(--status-h) 0;
  display: flex;
}
#tree-pane {
  flex: 1 1 auto;
  min-width: 260px;
  overflow: auto;
  position: relative;
}
#right-pane {
  flex: 0 0 380px;
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--border);
  background: var(--bg-panel);
}
body.no-right #right-pane { display: none; }

#inspector { flex: 1 1 auto; overflow: auto; }
#hexview {
  flex: 0 0 38%;
  border-top: 1px solid var(--border);
  overflow: auto;
  font: var(--mono);
  white-space: pre;
  background: var(--bg-input);
  padding: 8px;
}
#hexview.hidden { display: none; }
#hexview .addr { color: var(--text-faint); }
#hexview .bytes { color: var(--text-dim); }
#hexview .ascii { color: var(--text); }
#hexview .hl { color: var(--accent); font-weight: 700; }

/* ── tree ── */
#tree { padding: 8px 6px 40px; user-select: none; outline: none; }
#tree ul.tree { list-style: none; }
#tree ul.tree ul { list-style: none; margin-left: 18px; }
#tree li {
  display: block;
  margin: 1px 0;
  border-radius: 5px;
  white-space: nowrap;
}
#tree li > .node { display: flex; align-items: center; padding: 2px 6px; border-radius: 5px; cursor: default; }
#tree li > .node:hover { background: var(--bg-hover); }
#tree li.selected > .node { background: var(--sel); outline: 1px solid var(--accent); }
#tree li.dragover-top > .node::before,
#tree li.drop-target > .node::before { content: "—"; position: relative; left: -6px; color: var(--accent); }
#tree li.match { outline: 1px dashed var(--warn); }
#tree li.leaf-empty { opacity: .55; font-style: italic; }

.caret { width: 16px; flex: 0 0 16px; cursor: pointer; transition: transform .12s; color: var(--text-dim); }
.caret.open { transform: rotate(90deg); }
.caret.leaf { visibility: hidden; }
.icon { flex: 0 0 16px; margin-right: 5px; }

.entry-name { font-weight: 600; }
.entry-name.unnamed { color: var(--text-faint); font-style: italic; }
.entry-val { margin-left: 6px; color: var(--text-dim); }
.entry-val.mono { font-family: var(--mono); color: var(--accent); }
.entry-val.str { color: var(--ok); }
.badge {
  margin-left: 6px;
  padding: 0 6px;
  border-radius: 8px;
  background: var(--bg-raised);
  color: var(--text-dim);
  font-size: 10px;
}

.name-input {
  background: var(--bg-input);
  color: var(--text);
  border: 1px solid var(--accent);
  border-radius: 4px;
  font: inherit;
  padding: 0 4px;
  outline: none;
}

/* ── custom context menu ── */
.menu {
  position: fixed;
  z-index: 900;
  min-width: 190px;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, .4);
  padding: 4px;
  max-height: 70vh;
  overflow: auto;
}
.menu .mi { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
.menu .mi:hover { background: var(--bg-active); }
.menu .mi.disabled { opacity: .4; pointer-events: none; }
.menu .mi .mk { margin-left: auto; color: var(--text-faint); font-size: 10px; }
.menu .sep { height: 1px; background: var(--border); margin: 4px 6px; }
.menu .sub { position: relative; }
.menu .sub > .mi::after { content: "›"; margin-left: auto; color: var(--text-faint); }
.menu .sub-child {
  position: absolute;
  left: calc(100% - 4px);
  top: -4px;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, .4);
  padding: 4px;
  display: none;
  min-width: 160px;
}
.menu .sub:hover > .sub-child { display: block; }

/* ── inspector ── */
.panel-empty { padding: 30px 20px; color: var(--text-dim); text-align: center; }
.insp {
  padding: 12px;
}
.insp h2 { font-size: 13px; margin-bottom: 2px; display: flex; align-items: center; gap: 8px; }
.insp .path { color: var(--text-faint); font-family: var(--mono); font-size: 10px; margin: 2px 0 10px; word-break: break-all; }
.insp .type-chip {
  font-size: 10px; font-weight: 600;
  background: var(--bg-raised); color: var(--accent);
  border: 1px solid var(--accent); border-radius: 4px; padding: 1px 6px;
}
.field { margin: 10px 0; }
.field label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-faint); margin-bottom: 4px; }
input.in, textarea.in, select.in {
  width: 100%;
  background: var(--bg-input);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 8px;
  font: inherit;
  outline: none;
}
input.in:focus, textarea.in:focus { border-color: var(--accent); }
textarea.in { min-height: 90px; resize: vertical; font-family: var(--mono); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip {
  font-family: var(--mono); font-size: 10px;
  padding: 2px 7px; border-radius: 10px;
  background: var(--bg-raised); border: 1px solid var(--border);
  color: var(--text-dim);
}
.chip b { color: var(--text); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.actions button { font-size: 11px; padding: 3px 8px; }

.section-title { font-size: 11px; font-weight: 700; color: var(--text-dim); margin: 16px 0 6px; text-transform: uppercase; letter-spacing: .5px; }

table.array-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11px; }
table.array-table td { border-bottom: 1px solid var(--border); padding: 2px 4px; }
table.array-table input { width: 100%; background: transparent; border: 1px solid transparent; color: var(--text); border-radius: 4px; padding: 2px 4px; }
table.array-table input:hover { border-color: var(--border); }
table.array-table input:focus { border-color: var(--accent); outline: none; }
table.array-table .idx { color: var(--text-faint); width: 34px; }
.row-del { border: none; background: none; color: var(--err); cursor: pointer; }
.row-del:hover { filter: brightness(1.3); }

.smart-card { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-top: 8px; }
.smart-card .sc-head { display: flex; gap: 12px; padding: 8px 10px; background: var(--bg-raised); align-items: center; flex-wrap: wrap; }
.smart-card .sc-head .big { font-weight: 700; margin-right: auto; }
.smart-card .sc-grid { display: flex; gap: 14px; padding: 8px 10px; flex-wrap: wrap; }
.smart-card .sc-kv b { display: block; font-size: 10px; color: var(--text-faint); }
.smart-card .sc-kv span { font-family: var(--mono); }
.smart-inv { padding: 8px 10px; }
.smart-inv .slot { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--border); padding: 5px 0; }
.smart-inv .slot:first-child { border-top: none; }
.smart-inv .slot .count { font-family: var(--mono); color: var(--warn); min-width: 26px; }
.smart-inv .slot .name { flex: 1; }
.smart-inv .slot .extra { color: var(--text-faint); font-family: var(--mono); font-size: 10px; }

.hex-mini { font-family: var(--mono); font-size: 10px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; padding: 6px; max-height: 140px; overflow: auto; }
.preview-img { max-width: 100%; max-height: 180px; border-radius: 6px; border: 1px solid var(--border); margin-top: 6px; }

.notice { background: var(--bg-raised); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 6px; padding: 8px 10px; margin: 10px 0; display: flex; align-items: center; gap: 10px; }
.notice.warn { border-left-color: var(--warn); }
.notice.err { border-left-color: var(--err); }
.notice button { font-size: 11px; margin-left: auto; }

/* ── drop zone / loading ── */
#drop-zone {
  position: fixed; inset: 0; z-index: 500;
  display: none; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--accent) 14%, var(--bg));
  backdrop-filter: blur(2px);
}
body.dragging #drop-zone { display: flex; }
.dz-box { border: 2px dashed var(--accent); border-radius: 14px; padding: 50px 70px; text-align: center; background: var(--bg-panel); }
.dz-title { font-size: 22px; font-weight: 700; }
.dz-sub { color: var(--text-dim); margin-top: 8px; }

#loading-shade {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  transition: opacity .3s;
}
#loading-shade.done { opacity: 0; pointer-events: none; }
.load-box { text-align: center; color: var(--text-dim); }
.spinner {
  width: 34px; height: 34px; margin: 0 auto 14px;
  border: 3px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── statusbar ── */
#statusbar {
  position: absolute; bottom: 0; left: 0; right: 0; height: var(--status-h);
  display: flex; align-items: center; gap: 16px;
  padding: 0 12px;
  background: var(--bg-panel);
  border-top: 1px solid var(--border);
  font-size: 11px; color: var(--text-dim);
}
#statusbar b { color: var(--text); font-weight: 600; }
#st-errors.err { color: var(--err); }

/* ── toast ── */
#toasts { position: fixed; right: 14px; bottom: calc(var(--status-h) + 12px); z-index: 800; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--bg-raised); border: 1px solid var(--border);
  border-left: 3px solid var(--accent); border-radius: 8px;
  padding: 8px 14px; max-width: 360px; box-shadow: 0 6px 24px rgba(0, 0, 0, .35);
  animation: fadein .15s ease-out;
}
.toast.err { border-left-color: var(--err); }
.toast.warn { border-left-color: var(--warn); }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

/* dropfile helpers */
body.dragging * { pointer-events: none; }
body.dragging #drop-zone { pointer-events: auto; }
</style>

    caret.textContent = container ? '▶' : ' ';
    node.appendChild(caret);

    node.insertAdjacentHTML('beforeend', iconSvg(tag.t));

    const name = document.createElement('span');
    name.className = 'entry-name';
    if (isRoot) {
      name.textContent = tag.n || '(unnamed)';
      if (!tag.n) name.classList.add('unnamed');
    } else {
      name.textContent = String(path[path.length - 1]);
    }
    node.appendChild(name);

    if (!container) {
      const val = document.createElement('span');
      val.className = 'entry-val ' + (tag.t === T.String ? 'str' : 'mono');
      val.textContent = valueText(tag);
      node.appendChild(val);
    } else {
      const cntEl = document.createElement('span');
      cntEl.className = 'badge';
      cntEl.textContent = (isCompound(tag) ? tag.v.length + ' tags' : tag.v.length + ' items');
      node.appendChild(cntEl);
    }

    li.appendChild(node);

    if (container && open) {
      const ul = document.createElement('ul');
      ul.className = 'tree';
      const entries = childEntries(tag);
      for (const entry of entries) {
        ul.appendChild(this.buildNode(entry.tag, path.concat([entry.key]), false));

  Tree.prototype.attachDrag = function (li, node, path, container) {

/* ─────────────────────────────────────────────────────────────────────────────
 * inspector.js — side panel: edit values, arrays, smart structure cards.
 * Mutations go through api.commit(tag) so the app can push history + refresh.
 * ───────────────────────────────────────────────────────────────────────────── */

window.NBT = (function (ns) {
  'use strict';
  const { T, typeName, isCompound, isList } = ns;

  const IA_TYPES = [T.ByteArray, T.IntArray, T.LongArray];

  function Inspector(api) {
    this.api = api;
    this.el = api.el;
    this.cur = null; // { tag, path }
  }

  function el(tagName, cls, text) {
    const n = document.createElement(tagName);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function field(label) {
    const f = el('div', 'field');
    f.appendChild(el('label', null, label));
    return f;
  }

  Inspector.prototype.render = function (tag, path) {
    this.cur = { tag, path };
    const box = this.el;
    box.textContent = '';

    const api = this.api;

    // header
    const h = el('div', 'insp');
    const h2 = el('h2');
    h2.appendChild(el('span', 'type-chip', typeName(tag.t)));
    h2.appendChild(el('span', null, tag.n || nameFromPath(path)));
    // rename button for any tag
    if (!(path.length === 0)) {
      const rn = el('button', null, '✎ rename');
      rn.onclick = () => api.renameTag(path);
      h2.appendChild(rn);
    }
    h.appendChild(h2);
    const p = el('div', 'path', pathToStr(path));
    h.appendChild(p);

    // smart card
    if (api.smartEnabled && !path.length === false) {
      const smart = ns.mcdata.smartFor(tag, path);
      if (smart) h.appendChild(this.renderSmart(smart));
    }

    // value editors
    switch (tag.t) {
      case T.Byte: case T.Short: case T.Int: case T.Long: case T.Float: case T.Double:
        h.appendChild(this.renderNumber(tag));
        break;
      case T.String:
        h.appendChild(this.renderString(tag));
        break;
      case T.IntArray: case T.LongArray:
        h.appendChild(this.renderArray(tag));
        break;
      case T.ByteArray:
        h.appendChild(this.renderByteArray(tag));
        break;
      case T.List:
        h.appendChild(this.renderList(tag));
        break;
      case T.Compound:
        h.appendChild(this.renderCompound(tag));
        break;
      default: break;
    }

    // common actions
    const acts = el('div', 'actions');
    const addTypeBtn = el('button', null, '＋ New tag');
    addTypeBtn.onclick = () => api.addTag(path);
    acts.appendChild(addTypeBtn);
    const dupBtn = el('button', null, 'Duplicate');
    dupBtn.onclick = () => api.duplicate(tag, path);
    acts.appendChild(dupBtn);
    if (path.length > 0) {
      const delBtn = el('button', null, 'Delete');
      delBtn.className = 'danger';
      delBtn.onclick = () => api.deleteTag(tag, path);
      acts.appendChild(delBtn);
    }
    // always offer change type
    const ctBtn = el('button', null, 'Change type…');
    ctBtn.onclick = () => api.changeType(tag, path);
    acts.appendChild(ctBtn);
    const expBtn = el('button', null, 'Export SNBT');
    expBtn.onclick = () => api.exportSNBT(tag, path);
    acts.appendChild(expBtn);

    h.appendChild(acts);
    box.appendChild(h);
  };

  function nameFromPath(path) {
    return path.length ? String(path[path.length - 1]) : '(root)';
  }
  function pathToStr(path) {
    return '/' + path.map((s) => String(s)).join('/');
  }

  // ── scalar editors ──────────────────────────────────────────────────────────

  Inspector.prototype.renderNumber = function (tag) {
    const wrap = document.createElement('section');

    const f = field('value');
    const input = el('input', 'in');
    input.value = String(tag.v);
    input.spellcheck = false;

    const commit = () => {
      const parsed = ns.Tree && treeParse(tag, input.value);
      if (parsed !== undefined && Number(parsed) !== Number(tag.v)) {
        tag.v = parsed;
        api.commit(tag);
        this.render(tag, this.cur.path);
      }
    };
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') commit(); });
    input.addEventListener('blur', commit);
    f.appendChild(input);

    const chips = el('div', 'chips');
    switch (tag.t) {
      case T.Byte: {
        const b = Number(tag.v) & 0xff;
        chips.appendChild(chip('unsigned', b));
        chips.appendChild(chip('hex', '0x' + b.toString(16).padStart(2, '0')));
        chips.appendChild(chip('char', b >= 32 && b < 127 ? String.fromCharCode(b) : '·'));
        if (b === 0 || b === 1) {
          const set = (v) => () => { tag.v = v; api.commit(tag); this.render(tag, this.cur.path); };
          const b1 = el('button', 'chip', 'false');
          b1.onclick = set(0);
          const b2 = el('button', 'chip', 'true');
          b2.onclick = set(1);
          chips.appendChild(b1); chips.appendChild(b2);
        }
        break;
      }
      case T.Short: {
        const s = Number(tag.v) & 0xffff;
        chips.appendChild(chip('unsigned', s));
        chips.appendChild(chip('hex', '0x' + s.toString(16).padStart(4, '0')));
        break;
      }
      case T.Int: {
        const u = Number(tag.v) >>> 0;
        chips.appendChild(chip('unsigned', u));
        chips.appendChild(chip('hex', '0x' + (Number(tag.v) >>> 0).toString(16)));
        break;
      }
      case T.Long: {
        chips.appendChild(chip('hex', '0x' + (BigInt(tag.v) & 0xffffffffffffffffn).toString(16)));
        chips.appendChild(chip('unsigned', String(BigInt(tag.v) & 0xffffffffffffffffn)));
        break;
      }
      case T.Float: case T.Double:
        chips.appendChild(chip('exact', String(tag.v)));
        break;
      default: break;

    f.appendChild(chips);
    wrap.appendChild(f);
    return wrap;
  };

  function treeParse(tag, raw) {
    switch (tag.t) {
      case T.Byte: { const n = parseInt(raw, 10); return isNaN(n) ? undefined : (n & 0xff) << 24 >> 24; }
      case T.Short: { const n = parseInt(raw, 10); return isNaN(n) ? undefined : (n & 0xffff) << 16 >> 16; }
      case T.Int: { const n = parseInt(raw, 10); return isNaN(n) ? undefined : n | 0; }
      case T.Long: { const t = raw.trim(); if (!/^[+-]?\d+$/.test(t)) return undefined; try { return BigInt(t); } catch (e) { return undefined; } }
      case T.Float: { const n = parseFloat(raw); return isNaN(n) ? undefined : n; }
      case T.Double: { const n = parseFloat(raw); return isNaN(n) ? undefined : n; }
      default: return undefined;
    }
  }

  Inspector.prototype.renderString = function (tag) {
    const wrap = document.createElement('section');
    const f = field('string');
    const ta = el('textarea', 'in');
    ta.value = tag.v;
    ta.spellcheck = false;
    const size = el('div', 'chip', 'length: ' + tag.v.length + ' chars · ' + ns.codec && nc(tag.v));
    const commit = () => { if (ta.value !== tag.v) { tag.v = ta.value; api.commit(tag); } };
    ta.addEventListener('change', commit);
    f.appendChild(ta);
    f.appendChild(size);

    // JSON pretty preview if it parses
    try {
      const parsed = JSON.parse(tag.v);
      const pretty = JSON.stringify(parsed, null, 2);
      const jbtn = el('button', 'chip', 'looks like JSON — pretty');
      jbtn.onclick = () => { ta.value = pretty; commit(); };
      f.appendChild(jbtn);

    wrap.appendChild(f);
    return wrap;

    function nc(s) { return new TextEncoder().encode(s).length + ' bytes'; }
  };

  // ── array editors ───────────────────────────────────────────────────────────

  Inspector.prototype.renderArray = function (tag) {
    const wrap = document.createElement('section');
    const t = el('div', 'section-title', tag.t === T.IntArray ? 'int[] — ' + tag.v.length : 'long[] — ' + tag.v.length);
    wrap.appendChild(t);

    const table = el('table', 'array-table');
    const addRow = () => {
      tag.v.push(tag.t === T.LongArray ? 0n : 0);
      api.commit(tag);
      this.render(tag, this.cur.path);
    };
    const delRow = (i) => {
      tag.v.splice(i, 1);
      api.commit(tag);
      this.render(tag, this.cur.path);
    };
    const saveRow = (i) => {
      const inp = table.rows[i + 1].querySelector('input');
      const parsed = tag.t === T.LongArray ? parseLong(inp.value) : parseInt(inp.value, 10);
      if (parsed !== undefined && !(parsed === tag.v[i])) {
        tag.v[i] = parsed;
        api.commit(tag);
      }
    };

    tag.v.forEach((val, i) => {
      const tr = el('tr');
      tr.appendChild(el('td', 'idx', String(i)));
      const td = el('td');
      const inp = el('input');
      inp.value = String(val);
      inp.dataset.idx = i;
      inp.addEventListener('change', () => saveRow(i));
      td.appendChild(inp);
      tr.appendChild(td);
      const del = el('button', 'row-del', '✕');
      del.onclick = () => delRow(i);
      const tdd = el('td'); tdd.appendChild(del);
      tr.appendChild(tdd);
      table.appendChild(tr);
    });
    wrap.appendChild(table);
    const add = el('button', null, '＋ add row');
    add.onclick = addRow;
    wrap.appendChild(add);
    return wrap;

    function parseLong(s) {
      const t = String(s).trim();
      if (!/^[+-]?\d+$/.test(t)) return undefined;
      try { return BigInt(t); } catch (e) { return undefined; }
    }
  };

  Inspector.prototype.renderByteArray = function (tag) {
    const wrap = document.createElement('section');
    const bytes = ns.codec.b64ToBytes(tag.v);
    wrap.appendChild(el('div', 'section-title', 'byte[] — ' + bytes.length + ' bytes'));

    const preview = el('div', 'hex-mini', hexRows(bytes));
    wrap.appendChild(preview);

    // image sniff
    const imgDetect = detectImage(bytes);
    if (imgDetect) {
      const img = el('img', 'preview-img');
      img.src = imgDetect;
      const inners = imgDetect; // data url
      void inners;
      wrap.appendChild(img);
    }

    const f = field('replace bytes (hex or decimal, any separators)');
    const ta = el('textarea', 'in');
    ta.value = toHexWords(bytes);
    const commit = () => {
      const nb = parseByteList(ta.value);
      if (nb !== null) {
        tag.v = ns.codec.bytesToB64(nb);
        api.commit(tag);
        this.render(tag, this.cur.path);
      }
    };
    ta.addEventListener('change', commit);
    f.appendChild(ta);
    wrap.appendChild(f);
    return wrap;
  };

  function hexRows(bytes, perRow) {
    perRow = perRow || 16;
    let out = '';
    for (let i = 0; i < bytes.length; i += perRow) {
      out += i.toString(16).padStart(6, '0') + '  ';
      for (let j = i; j < i + perRow && j < bytes.length; j++) {
        out += bytes[j].toString(16).padStart(2, '0') + ' ';
      }
      out += '  ';
      for (let j = i; j < i + perRow && j < bytes.length; j++) {
        out += (bytes[j] >= 32 && bytes[j] < 127) ? String.fromCharCode(bytes[j]) : '.';

      out += '\n';

  function toHexWords(bytes) {

  function parseByteList(text) {

      const n = /^0x/i.test(w) ? parseInt(w, 16) : parseInt(w, 10);

  // ── list & compound ─────────────────────────────────────────────────────────

  Inspector.prototype.renderList = function (tag) {

    const f = field('entry type');
    const sel = el('select', 'in');

  };

  Inspector.prototype.renderCompound = function (tag) {

    const add = el('button', null, '＋ add tag');

  };

  Inspector.prototype.renderSmart = function (smart) {

    const head = el('div', 'sc-head');
    head.appendChild(el('span', 'big', smart.title));
    card.appendChild(head);

    if (smart.items) this.renderInventory(card, smart.items, 'Inventory');

      const inv = el('div', 'smart-inv');
      inv.appendChild(this.itemRow(smart.item));
      card.appendChild(inv);
    }
    return card;
  };

  Inspector.prototype.renderInventory = function (card, items, title) {
    const inv = el('div', 'smart-inv');
    inv.appendChild(el('div', 'section-title', title));
    for (const it of items) inv.appendChild(this.itemRow(it));

  Inspector.prototype.itemRow = function (it) {

    row.appendChild(cnt);
    row.appendChild(el('span', 'name', it.displayName));

    c.appendChild(el('b', null, label));
    c.appendChild(document.createTextNode(': ' + value));

/* ─────────────────────────────────────────────────────────────────────────────
 * app.js — application shell: documents, history, toolbar, menus, region.
 * ───────────────────────────────────────────────────────────────────────────── */

window.App = (function (ns) {
  'use strict';
  const { T, isCompound, isList, clone } = ns;

  const A = {
    doc: null,          // { kind:'nbt'|'chunk', filename, model, mode, region?, x?, z?, compression? }
    region: null,       // { container, filename } for open region documents
    hist: [], future: [],
    clipboard: null,
    selectedPath: null,
    hexOn: true, smartOn: true, theme: 'dark',
    inspector: null, tree: null,
  };

  // ── dom ─────────────────────────────────────────────────────────────────────

  let $ = (s) => document.querySelector(s);
  let refs = {};

  function grab() {
    refs = {
      tree: $('#tree'), inspector: $('#inspector'),
      hex: $('#hexview'), status: {
        file: $('#st-file'), mode: $('#st-mode'), count: $('#st-count'),
        errors: $('#st-errors'), history: $('#st-history'),
      },
      shade: $('#loading-shade'), loading: $('#loading-text'),
      empty: $('#empty-state'), file: $('#file-input'), drop: $('#drop-zone'),
      search: $('#search-field'),
    };
  }

  // ── history ─────────────────────────────────────────────────────────────────

  function pushHistory() {
    if (!A.doc || A.doc.kind !== 'nbt' && A.doc.kind !== 'chunk') return;
    A.hist.push(clone(A.doc.model));
    if (A.hist.length > 200) A.hist.shift();
    A.future.length = 0;
    A.refreshHistory();
  }

  function undo() {
    if (!A.hist.length) return;
    A.future.push(clone(A.doc.model));
    A.doc.model = A.hist.pop();
    A.refreshAll();
  }

  function redo() {
    if (!A.future.length) return;
    A.hist.push(clone(A.doc.model));
    A.doc.model = A.future.pop();
    A.refreshAll();
  }

  // ── tree wiring ─────────────────────────────────────────────────────────────

  function makeTree() {
    A.tree = new ns.Tree({
      el: refs.tree,
      root: A.doc ? A.doc.model : null,
      movable: true,
      onSelect: (path) => {
        A.selectedPath = path;
        renderInspector();
      },
      onCommit: (tag) => { commitEdit(); },
      onRename: (tag, path, newName) => { commitRename(tag, path, newName); },
      onMove: (info) => { moveTag(info); },
      onContextMenu: (path, x, y) => { showContextMenu(path, x, y); },
    });
    renderInspector();
  }

  function commitEdit() {
    pushHistory();
    A.refreshAll();
  }

  function commitRename(tag, path, newName) {
    if (!A.doc) return;
    pushHistory();
    if (path.length === 0) {
      tag.n = newName;
    } else {
      const parent = ns.getByPath(A.doc.model, path.slice(0, -1));
      const key = path[path.length - 1];
      if (isCompound(parent)) {
        const pair = parent.v.find(([k]) => k === key);
        if (pair) { pair[0] = newName; tag.n = newName; }
      } else if (isList(parent)) {
        tag.n = newName; // list children have no key; name is informational
      }
    }
    A.refreshAll();
  }

  // ── refresh ─────────────────────────────────────────────────────────────────

  function refreshAll() {
    if (A.doc && (A.doc.kind === 'nbt' || A.doc.kind === 'chunk')) {
      A.tree.root = A.doc.model;
      refs.tree.classList.remove('hidden');
      A.refreshTree();
      renderInspector();
      updateHex();
      A.refreshStatus();
      A.refreshButtons();
    } else if (A.doc && A.doc.kind === 'region') {
      refs.tree.classList.add('hidden');
      renderRegionGrid();
    }
  }

  // ── inspector ───────────────────────────────────────────────────────────────

  function currentTag() {
    if (!A.doc || A.doc.kind === 'region') return null;
    if (!A.selectedPath) return null;
    return ns.getByPath(A.doc.model, A.selectedPath);
  }

  function renderInspector() {
    if (!A.inspector) {
      A.inspector = new ns.Inspector({
        el: refs.inspector,
        smartEnabled: () => A.smartOn,
        commit: () => commitEdit(),
        addTag: (path) => addTag(path),
        renameTag: (path) => {
          const tag = ns.getByPath(A.doc.model, path);
          if (tag) A.tree.beginNameEdit(path, tag);
        },
        deleteTag: (tag, path) => deleteTag(path),
        duplicate: (tag, path) => duplicateTag(tag, path),
        changeType: (tag, path) => changeTypeMenu(tag, path),
        exportSNBT: (tag, path) => exportSNBT(tag),
      });
    }
    const tag = currentTag();
    if (!tag) { refs.inspector.innerHTML = '<div class="panel-empty">Select a tag to inspect &amp; edit it.</div>'; return; }
    A.inspector.render(tag, A.selectedPath);
  }

  // ── structural ops ──────────────────────────────────────────────────────────

  function parentOf(path) {
    return path.length ? ns.getByPath(A.doc.model, path.slice(0, -1)) : null;
  }

  function addTag(path) {
    if (!A.doc) return;
    pushHistory();
    const target = ns.getByPath(A.doc.model, path);
    const container = target && (isCompound(target) || isList(target)) ? target : parentOf(path);
    if (!container) return;
    const newPath = [];
    if (isCompound(container)) {
      const name = nextFreeKey(container, 'new_tag');
      const child = ns.createTag(T.Compound, name);
      container.v.push([name, child]);
      newPath.push(...path, name);
    } else if (isList(container)) {
      const child = ns.createTag(container.et, '');
      container.v.push(child);
      newPath.push(...path, String(container.v.length - 1));
    }
    A.refreshAll();
    if (newPath.length) { A.selectedPath = newPath; A.tree.select(newPath, true); }
  }

  function nextFreeKey(container, base) {
    let name = base, i = 1;
    while (container.v.some(([k]) => k === name)) name = base + '_' + (i++);
    return name;
  }

  function deleteTag(path) {
    if (!A.doc || path.length === 0) return;
    pushHistory();
    const parent = ns.getByPath(A.doc.model, path.slice(0, -1));
    const key = path[path.length - 1];
    if (!parent) return;
    if (isCompound(parent)) {
      const i = parent.v.findIndex(([k]) => k === key);
      if (i >= 0) parent.v.splice(i, 1);
    } else if (isList(parent)) {
      parent.v.splice(Number(key), 1);
    }
    A.selectedPath = path.slice(0, -1);
    A.refreshAll();
  }

  function duplicateTag(tag, path) {
    if (!A.doc) return;
    pushHistory();
    const parent = ns.getByPath(A.doc.model, path.slice(0, -1));
    const key = path[path.length - 1];
    const copy = clone(tag);
    if (isCompound(parent)) {
      const name = nextFreeKey(parent, key + '_copy');
      parent.v.push([name, copy]);
      copy.n = name;
      A.selectedPath = path.slice(0, -1).concat([name]);
    } else if (isList(parent)) {
      parent.v.splice(Number(key) + 1, 0, copy);
      A.selectedPath = path.slice(0, -1).concat([String(Number(key) + 1)]);
    } else return;
    A.refreshAll();
  }

  function changeTypeMenu(tagObj, path) {
    const x = 0, y = 0;
    const items = [1, 2, 3, 4, 5, 6, 8, 7, 9, 10, 11, 12].map((t) => ({
      label: ns.typeName(t), icon: ns.iconSvg(t),
      action: () => changeType(path, t),
    }));
    showMenu(x, y, items);
  }

  function changeType(path, newType) {
    if (!A.doc) return;
    pushHistory();
    const tag = ns.getByPath(A.doc.model, path);
    if (!tag) return;
    const oldT = tag.t;
    tag.t = newType;
    tag.et = undefined;
    const fresh = ns.createTag(newType, tag.n);
    tag.v = fresh.v;
    if (isList(tag)) tag.et = fresh.et;
    // try convert numeric values
    if (isNumeric(oldT) && isNumeric(newType) && !isLong(oldT) && !isLong(newType)) {
      tag.v = oldT === newType ? tag.v : Number(tag.v);
    }
    if (newType === T.Long && isNumeric(oldT) && !isLong(oldT)) tag.v = BigInt(Math.trunc(Number(tag.v)));
    if (oldT === T.Long && isNumeric(newType)) { /* can't safely shrink; leave as-is */ tag.v = Number(tag.v); }
    A.refreshAll();
  }

  function isNumeric(t) { return t >= T.Byte && t <= T.Double; }
  function isLong(t) { return t === T.Long; }

  // ── tree dnd create handler ────────────────────────────────────────────────

  function moveTag(info) {
    if (!A.doc) return;
    const { fromPath, destPath, zone, destIsContainer } = info;

    const parent = parentOf(fromPath);
    const key = fromPath[fromPath.length - 1];
    if (!parent) return;

    // prevent self-contain
    const fp = fromPath.join('\u001f'), dp = destPath.join('\u001f');
    if (dp.startsWith(fp + '\u001f')) return;

    pushHistory();
    // detach
    let tag;
    if (isCompound(parent)) {
      const i = parent.v.findIndex(([k]) => k === key);
      tag = parent.v[i][1];
      parent.v.splice(i, 1);
    } else {
      tag = parent.v.splice(Number(key), 1)[0];
    }

    const insertAt = (container, index, moved) => {
      if (isCompound(container)) {
        const name = nextFreeKey(container, tag.n || 'new_tag');
        container.v.splice(index, 0, [name, moved]);
        moved.n = name;
      } else {
        // list: keep uniform type
        if (isList(container)) {
          if (container.et !== T.End && container.et !== moved.t) {
            if (container.v.length === 0) container.et = moved.t;
            else { A.refreshAll(); toast('Cannot move ' + ns.typeName(moved.t) + ' into List<' + ns.typeName(container.et) + '>', 'err'); return; }
          }
          if (container.v.length === 0) container.et = moved.t;
        }
        container.v.splice(index, 0, moved);
      }
    };

    if (zone === 'mid' && destIsContainer) {
      const dest = ns.getByPath(A.doc.model, destPath);
      insertAt(dest, 0, tag);
      A.selectedPath = destPath.concat([compoundKey(dest, 0, tag)]);
    } else {
      const destParent = parentOf(destPath);
      const dKey = destPath[destPath.length - 1];
      let index;
      if (isCompound(destParent)) {
        index = destParent.v.findIndex(([k]) => k === dKey);
      } else {
        index = Number(dKey);
      }
      if (index < 0) index = 0;
      if (zone === 'bottom') index += 1;
      insertAt(destParent, index, tag);
      A.selectedPath = destPath.slice(0, -1).concat([compoundKey(destParent, index < destParent.v.length ? index : index, tag)]);
    }

    A.refreshAll();
  }

  function compoundKey(container, i, tag) {
    return isCompound(container) ? container.v[i] && container.v[i][0] : String(i);
  }

  // ── menus ───────────────────────────────────────────────────────────────────

  function showContextMenu(path, x, y) {
    if (!A.doc) return;
    const tag = ns.getByPath(A.doc.model, path);
    if (!tag) return;

    const items = [];
    if (path.length > 0) {
      items.push({ label: 'Rename…', key: 'F2', action: () => A.tree.beginNameEdit(path, tag) });
      items.push({ label: 'Duplicate', action: () => duplicateTag(tag, path) });
      items.push({ label: 'Copy', key: 'Ctrl+C', action: () => copyTag(tag) });
      if (A.clipboard) items.push({ label: 'Paste after', key: 'Ctrl+V', action: () => pasteAfter(path) });
    } else {
      items.push({ label: 'Rename…', action: () => A.tree.beginNameEdit(path, tag) });
    }
    items.push({ sep: true });

    if (isCompound(tag)) {
      items.push({
        label: '▾ New', submenu: [
          [1, 2, 3, 4, 5, 6, 8, 7, 11, 12, 9, 10].map((t) => ({
            label: ns.typeName(t), icon: ns.iconSvg(t),
            action: () => { pushHistory(); const name = nextFreeKey(tag, 'new_tag'); const c = ns.createTag(t, name); tag.v.push([name, c]); A.refreshAll(); },
          })),
        ],
      });
      items.push({ label: 'Sort keys', action: () => { pushHistory(); tag.v.sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0); A.refreshAll(); } });
    }
    if (isList(tag)) {
      items.push({
        label: 'Add element', action: () => {
          pushHistory();
          const c = ns.createTag(tag.et === T.End ? T.Int : tag.et, '');
          tag.v.push(c);
          if (tag.et === T.End) tag.et = c.t;
          A.refreshAll();
        },
      });
      items.push({
        label: '▾ Element type', submenu: [
          [1, 2, 3, 4, 5, 6, 8, 10].map((t) => ({
            label: ns.typeName(t), icon: ns.iconSvg(t),
            action: () => { pushHistory(); if (tag.v.length) tag.v = []; tag.et = t; A.refreshAll(); },
          })),
        ],
      });
    }
    if (path.length > 0) {
      items.push({ label: 'Delete', key: 'Del', danger: true, action: () => deleteTag(path) });
    }

    items.push({ sep: true });
    items.push({ label: '▾ Change type', submenu: [
      [1, 2, 3, 4, 5, 6, 8, 7, 11, 12, 9, 10].map((t) => ({
        label: ns.typeName(t), icon: ns.iconSvg(t), action: () => changeType(path, t),
      })),
    ] });

    showMenu(x, y, items);
  }

  function showMenu(x, y, items) {
    closeMenus();
    const menu = el2('div'); menu.className = 'menu';
    for (const it of items) {
      if (it.sep) { menu.appendChild(el2('div')); menu.lastChild.className = 'sep'; continue; }
      if (it.submenu) {
        const sub = el2('div'); sub.className = 'sub';
        const mi = el2('div'); mi.className = 'mi';
        mi.innerHTML = it.label;
        sub.appendChild(mi);
        const child = el2('div'); child.className = 'sub-child';
        for (const c of it.submenu[0]) {
          const ci = el2('div'); ci.className = 'mi';
          if (c.icon) ci.insertAdjacentHTML('beforeend', c.icon);
          ci.appendChild(document.createTextNode(c.label));
          ci.onclick = () => { closeMenus(); c.action(); };
          child.appendChild(ci);
        }
        sub.appendChild(child);
        menu.appendChild(sub);
        continue;
      }
      const mi = el2('div'); mi.className = 'mi' + (it.danger ? ' danger' : '');
      mi.appendChild(document.createTextNode(it.label));
      if (it.key) { const k = el2('span'); k.className = 'mk'; k.textContent = it.key; mi.appendChild(k); }
      mi.onclick = () => { closeMenus(); it.action(); };
      menu.appendChild(mi);
    }
    document.body.appendChild(menu);
    const r = menu.getBoundingClientRect();
    menu.style.left = Math.min(x, window.innerWidth - r.width - 8) + 'px';
    menu.style.top = Math.min(y, window.innerHeight - r.height - 8) + 'px';
    setTimeout(() => document.addEventListener('click', closeMenus, { once: true }), 10);
  }

  function closeMenus() {
    document.querySelectorAll('.menu').forEach((m) => m.remove());
  }

  function el2(tag) { return document.createElement(tag); }

  // ── clipboard ───────────────────────────────────────────────────────────────

  function copyTag(tag) { A.clipboard = clone(tag); toast('Copied ' + ns.typeName(tag.t)); }

  function pasteAfter(path) {
    if (!A.doc || !A.clipboard) return;
    pushHistory();
    const parent = parentOf(path);
    if (isCompound(parent)) {
      const key = path[path.length - 1];
      const i = parent.v.findIndex(([k]) => k === key);
      const copy = clone(A.clipboard);
      const name = nextFreeKey(parent, 'copy_' + key);
      copy.n = name;
      parent.v.splice(i + 1, 0, [name, copy]);
    } else if (isList(parent)) {
      const copy = clone(A.clipboard);
      parent.v.splice(Number(path[path.length - 1]) + 1, 0, copy);
    } else return;
    A.refreshAll();
  }

  // ── files ───────────────────────────────────────────────────────────────────

  async function openFile(file) {
    const buf = new Uint8Array(await file.arrayBuffer());
    // region probe
    if (ns.region.probe(buf) || /\.(mca|mcr)$/i.test(file.name)) {
      A.region = { container: ns.region.create(buf), filename: file.name };
      A.doc = { kind: 'region', filename: file.name };
      refs.empty.classList.add('hidden');
      A.refreshStatus();
      refreshAll();
      return;
    }
    const loaded = await ns.codec.loadBuffer(buf);
    if (!loaded.decoded) {
      toast('Could not parse file as NBT', 'err');
      return;
    }
    A.doc = {
      kind: 'nbt', filename: file.name, model: loaded.res.root, mode: loaded.mode,
    };
    A.hist = []; A.future = [];
    A.selectedPath = null;
    refs.empty.classList.add('hidden');
    A.refreshStatus();
    refreshAll();
    if ((loaded.res.errors || []).length) {
      toast('Parse had issues (' + loaded.res.errors.length + ') — lenient mode', 'warn');
    }
  }

  async function saveDoc() {
    if (!A.doc) return;
    if (A.doc.kind === 'region') {
      const bytes = await A.region.container.pack();
      ns.codec.download(bytes, A.region.filename);
      toast('Saved region file');
      return;
    }
    if (A.doc.kind === 'chunk' && A.doc.region) {
      // write back to region container (dirty chunk)
      if (A.doc.region && A.doc.region.container) {
        A.doc.region.container.setChunkModel(A.doc.x, A.doc.z, A.doc.model, 2);
      }
      toast('Staged chunk r.' + A.doc.x + '.' + A.doc.z + ' — save the region file to write', 'warn');
      return;
    }
    const bytes = await ns.codec.compileModel(A.doc.model, A.doc.mode || 'gzip');
    ns.codec.download(bytes, A.doc.filename);
    toast('Saved ' + A.doc.filename);
  }

  // ── region grid ─────────────────────────────────────────────────────────────

  function renderRegionGrid() {
    const c = A.region.container;
    const chunks = c.listChunks();
    const box = el2('div');
    box.style.cssText = 'padding:14px;overflow:auto;height:100%';
    box.innerHTML = '<h2 style="margin-bottom:8px">Region file — ' + chunks.length + ' chunks</h2>';
    const grid = el2('div');
    grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px';
    if (chunks.length === 0) {
      box.appendChild(grid);
      const none = el2('div');
      none.textContent = 'No chunks in this region.';
      box.appendChild(none);
      refs.tree.innerHTML = '';
      refs.tree.appendChild(box);
      return;
    }
    for (const chunk of chunks) {
      const cell = el2('button');
      cell.textContent = 'r.' + chunk.x + '.' + chunk.z;
      cell.style.cssText = 'text-align:left;padding:6px';
      cell.onclick = async () => {
        const model = await c.chunkModel(chunk.x, chunk.z);
        if (!model) { toast('Chunk unreadable', 'err'); return; }
        A.doc = { kind: 'chunk', filename: chunk.x + '.' + chunk.z + '.nbt', model, mode: 'zlib', region: c, x: chunk.x, z: chunk.z };
        A.hist = []; A.future = [];
        A.selectedPath = null;
        refs.tree.classList.remove('hidden');
        A.refreshStatus();
        refreshAll();
      };
      grid.appendChild(cell);
    }
    box.appendChild(grid);
    // save region button
    const saveBtn = el2('button');
    saveBtn.textContent = 'Save region file';
    saveBtn.style.marginTop = '12px';
    saveBtn.onclick = async () => {
      if (A.doc.kind === 'chunk') {
        A.region.container.setChunkModel(A.doc.x, A.doc.z, A.doc.model, 2);
        A.doc = { kind: 'region', filename: A.region.filename };
        refreshAll();
        await new Promise((r) => setTimeout(r, 30));
      }
      const bytes = await A.region.container.pack();
      ns.codec.download(bytes, A.region.filename);
      toast('Saved region file');
    };
    refs.tree.innerHTML = '';
    refs.tree.appendChild(box);
  }

  // ── hex ─────────────────────────────────────────────────────────────────────

  function updateHex() {
    if (!A.hexOn) return;
    if (!A.doc || A.doc.kind === 'region') { refs.hex.textContent = ''; return; }
    try {
      const wasm = ns.codec._module;
      const b64 = wasm.encode(A.doc.model);
      const bytes = ns.codec.b64ToBytes(b64);
      refs.hex.textContent = ns.hexRows(bytes, 16);
    } catch (e) { refs.hex.textContent = '…'; }
  }

  // ── status / buttons ────────────────────────────────────────────────────────

  function refreshStatus() {
    const s = refs.status;
    if (!A.doc) return;
    s.file.textContent = A.doc.filename || '—';
    if (A.doc.kind === 'region') {
      s.mode.textContent = 'region · ' + A.region.container.listChunks().length + ' chunks';
      s.count.textContent = '';
      s.errors.textContent = '';
    } else {
      const mode = A.doc.kind === 'chunk' ? ('chunk ' + A.doc.x + '.' + A.doc.z + ') ') : '';
      s.mode.textContent = mode + (ns.codec.MODES[A.doc.mode] ? ns.codec.MODES[A.doc.mode].label : '');
      s.count.textContent = ns.countTags(A.doc.model) + ' tags';
      s.errors.textContent = '';
      if (A.doc.model && A.doc.n) {}
    }
    refreshHistory();
  }

  function refreshHistory() {
    refs.status.history.textContent = A.hist.length ? 'hist ' + A.hist.length : '';
  }

  function refreshButtons() {
    const has = !!(A.doc && A.doc.kind !== 'region');
    $('#btn-undo').disabled = A.hist.length === 0;
    $('#btn-redo').disabled = A.future.length === 0;
    $('#btn-delete').disabled = !has || !A.selectedPath || A.selectedPath.length === 0;
    $('#btn-duplicate').disabled = !has || !A.selectedPath;
  }

  // ── formats ─────────────────────────────────────────────────────────────────

  function exportSNBT(tag) {
    const text = ns.toSNBT(tag, { indent: true });
    ns.codec.download(new TextEncoder().encode(text), 'tag.snbt', 'text/plain');
  }

  function exportCurrentSNBT() {
    if (!A.doc || A.doc.kind === 'region') return;
    const text = ns.toSNBT(A.doc.model, { indent: true });
    ns.codec.download(new TextEncoder().encode(text), A.doc.filename.replace(/\.[^.]+$/, '') + '.snbt', 'text/plain');
  }

  function exportCurrentJSON() {
    if (!A.doc || A.doc.kind === 'region') return;
    const text = JSON.stringify(ns.toJSON(A.doc.model), null, 2);
    ns.codec.download(new TextEncoder().encode(text), A.doc.filename.replace(/\.[^.]+$/, '') + '.json', 'application/json');
  }

  async function importText(file) {
    const text = await file.text();
    try {
      const tag = ns.parseSNBT(text);
      A.doc = { kind: 'nbt', filename: file.name.replace(/\.(snbt|txt|nbt)$/i, '.dat'), model: tag, mode: 'gzip' };
      A.hist = []; A.future = [];
      A.selectedPath = null;
      refs.empty.classList.add('hidden');
      A.refreshStatus();
      refreshAll();
      toast('Imported from SNBT');
    } catch (e) {
      try {
        const obj = JSON.parse(text);
        const tag = ns.fromJSON(obj);
        A.doc = { kind: 'nbt', filename: file.name.replace(/\.json$/i, '.dat'), model: tag, mode: 'gzip' };
        A.hist = []; A.future = [];
        A.selectedPath = null;
        refs.empty.classList.add('hidden');
        A.refreshStatus();
        refreshAll();
        toast('Imported from JSON');
      } catch (e2) {
        toast('Import failed: ' + e.message, 'err');
      }
    }
  }

  function showFormatsMenu(x, y) {
    const items = [
      { label: 'Export as SNBT', action: exportCurrentSNBT },
      { label: 'Export as JSON', action: exportCurrentJSON },
      { sep: true },
      { label: 'Import SNBT / JSON file…', action: () => refs.file.click() },
    ];
    showMenu(x, y, items);
  }

  // ── toast ───────────────────────────────────────────────────────────────────

  let toastsBox = null;
  function toast(msg, kind) {
    if (!toastsBox) { toastsBox = el2('div'); toastsBox.id = 'toasts'; document.body.appendChild(toastsBox); }
    const t = el2('div'); t.className = 'toast ' + (kind || '');
    t.textContent = msg;
    toastsBox.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }

  // ── theme ───────────────────────────────────────────────────────────────────

  function applyTheme() {
    document.documentElement.dataset.theme = A.theme;
    try { localStorage.setItem('webnbt-theme', A.theme); } catch (e) {}
  }

  // ── events ──────────────────────────────────────────────────────────────────

  function wire() {
    $('#btn-open').onclick = () => refs.file.click();
    $('#btn-save').onclick = saveDoc;
    $('#btn-undo').onclick = () => { undo(); A.refreshButtons && A.refreshButtons(); };
    $('#btn-redo').onclick = () => { redo(); };
    $('#btn-delete').onclick = () => A.selectedPath && deleteTag(A.selectedPath);
    $('#btn-duplicate').onclick = () => {
      const tag = currentTag();
      if (tag && A.selectedPath) duplicateTag(tag, A.selectedPath);
    };
    $('#btn-add').onclick = () => { const p = A.selectedPath || []; addTag(p); };
    $('#btn-hex').onclick = (e) => {
      A.hexOn = !A.hexOn;
      e.target.classList.toggle('active', A.hexOn);
      refs.hex.classList.toggle('hidden', !A.hexOn);
      if (A.hexOn) updateHex();
      document.body.classList.toggle('no-right-inset', !A.hexOn);
    };
    $('#btn-smart').onclick = (e) => {
      A.smartOn = !A.smartOn;
      e.target.classList.toggle('active', A.smartOn);
      renderInspector();
    };
    $('#btn-theme').onclick = () => {
      A.theme = A.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
    };
    $('#btn-export').onclick = (e) => {
      const r = e.target.getBoundingClientRect();
      showFormatsMenu(r.left, r.bottom);
    };

    refs.file.addEventListener('change', (e) => {
      for (const f of e.target.files) openFile(f);
      refs.file.value = '';
    });

    // drag & drop
    let dragDepth = 0;
    window.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
    window.addEventListener('dragleave', (e) => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
    window.addEventListener('dragover', (e) => e.preventDefault());
    refs.drop.addEventListener('drop', (e) => {
      e.preventDefault();
      dragDepth = 0;
      document.body.classList.remove('dragging');
      for (const f of e.dataTransfer.files) openFile(f);
    });

    // search
    let searchTimer = null;
    refs.search.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => A.tree && A.tree.applySearch(refs.search.value.trim()), 180);
    });
    refs.search.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && A.tree) { e.preventDefault(); A.tree.focusSearch(A.tree.searchIdx + 1); }
      if (e.key === 'Escape') { refs.search.value = ''; A.tree && A.tree.applySearch(''); }
    });

    $('#empty-open').onclick = () => refs.file.click();

    // keyboard
    window.addEventListener('keydown', (e) => {
      const tgt = e.target;
      if (tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'TEXTAREA' || tgt.isContentEditable)) {
        if (e.key === 'Escape') { closeMenus(); refs.tree.focus(); }
        return;
      }
      const mod = e.ctrlKey || e.metaKey;
      if (mod && e.key.toLowerCase() === 'o') { e.preventDefault(); refs.file.click(); }
      else if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveDoc(); }
      else if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
      else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
      else if (mod && e.key.toLowerCase() === 'c') { const t = currentTag(); if (t) copyTag(t); }
      else if (mod && e.key.toLowerCase() === 'v') { if (A.selectedPath) pasteAfter(A.selectedPath); }
      else if (e.key === 'Delete' || e.key === 'Backspace') { if (A.selectedPath && A.selectedPath.length) deleteTag(A.selectedPath); }
      else if (e.key === 'F2') { if (A.selectedPath) { const t = currentTag(); if (t) A.tree.beginNameEdit(A.selectedPath, t); } }
      else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        // basic navigation: select next/prev visible node
        const all = Array.from(refs.tree.querySelectorAll('li'));
        if (all.length) {
          const cur = all.findIndex((li) => li.classList.contains('selected'));
          const ni = Math.max(0, Math.min(all.length - 1, cur === -1 ? 0 : cur + (e.key === 'ArrowDown' ? 1 : -1)));
          const path = all[ni].dataset.path.split('\u001f').filter(Boolean);
          A.tree.select(path, true);
        }
        e.preventDefault();
      }
    });

    // theme init
    try { const saved = localStorage.getItem('webnbt-theme'); if (saved) A.theme = saved; } catch (e2) {}
    applyTheme();
  }

  // ── boot ────────────────────────────────────────────────────────────────────

  async function boot() {
    if (A.booted) return;
    A.booted = true;
    grab();
    const start = performance.now();
    refs.loading.textContent = 'Booting NBT codec…';
    await ns.codec.ready();
    refs.loading.textContent = 'Ready';
    refs.shade.classList.add('done');
    makeTree();
    wire();
    refreshButtons();
    setTimeout(() => refs.shade.remove(), 400);
  }

  A.refreshAll = refreshAll;
  A.refreshStatus = refreshStatus;
  A.refreshButtons = refreshButtons;
  A.refreshTree = () => A.tree.refresh();
  A.refreshHistory = refreshHistory;

  return {
    boot,
    undo, redo,
    pushHistory,
    toast,
    saveDoc,
    openFile,
  };
})(window.NBT || {});

window.addEventListener('DOMContentLoaded', () => {
  window.App.boot();
});
</script>
